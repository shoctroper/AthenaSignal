# AthenaSignal M5 — Autonomous Editorial Intelligence Platform (bootstrap run).
# Deterministic gates are VERDE over the post-M4 repository, so the root run
# yields a HUMAN GATE via required semantic review (offline reviewer
# unavailable). The human RETURN authorizes the OpenCode worker to implement
# ciclo/ORDEN-009.md. Functional verification via athenasignal-m5-verify.spec.yaml.
id: athenasignal-m5-autonomous-editorial-intelligence
version: 1

root: ../..

gate_policy:
  scope:
    required: true
  tests:
    required: true
  artifacts:
    required: true
  regressions:
    required: true
  reproducibility:
    required: true

review:
  enabled: true
  required: true

scope:
  baseline: governance/specs/athenasignal-m5.baseline.json
  allow:
    - src/
    - tests/
    - scripts/
    - ciclo/
    - docs/
    - evidence/
    - data/
    - governance/
    - package.json
    - package-lock.json
    - tsconfig.json
    - AGENTS.md
    - README.md
  deny:
    - decisiones/
    - .env
    - perfil_navegador_llm/
  ignore:
    - governance
    - node_modules
    - perfil_navegador_llm
    - .m5tmp
    - .m4tmp
    - .m3tmp

acceptance:
  tests:
    command: npm test
    required: true
    junit: false
    timeout: 420.0

  regressions:
    max: 0
    baseline: governance/specs/athenasignal-m5.regressions.json

  artifacts:
    required:
      - path: src/radar/engine.ts
        kind: file
      - path: tests/editorial-radar-e2e.test.ts
        kind: file
      - path: package.json
        kind: file

verification:
  reproducible_runs: 2
  reproducible_command: >-
    node -e "process.stdout.write('athenasignal-m5-probe')"
  reproducible_timeout: 60.0

escalate_when:
  - ambiguous_specification
