# AthenaSignal M3 — Autonomous Signal Intelligence (STRICT verification run).
# Executed directly after the worker builds, to obtain deterministic
# red->green evidence for ciclo/ORDEN-007.md. Fails today (M3 test, replay
# script and evidence/m3/*.json do not exist yet); must pass once M3 is built.
id: athenasignal-m3-autonomous-signal-intelligence-verify
version: 1

root: ../..

gate_policy:
  scope:
    required: true
  tests:
    required: true
  artifacts:
    required: true
  regressions:
    required: true
  reproducibility:
    required: true

review:
  enabled: false
  required: false

scope:
  baseline: governance/specs/athenasignal-m3.baseline.json
  allow:
    - src/
    - tests/
    - scripts/
    - ciclo/
    - docs/
    - evidence/
    - governance/
    - package.json
    - package-lock.json
    - tsconfig.json
    - AGENTS.md
    - README.md
  deny:
    - decisiones/
    - .env
    - perfil_navegador_llm/
  ignore:
    - governance
    - node_modules
    - perfil_navegador_llm

acceptance:
  tests:
    command: 'test -f tests/autonomous-intelligence-e2e.test.ts && test -f scripts/m3-replay.ts && node --test --experimental-strip-types tests/domain.test.ts tests/adapters.test.ts tests/signal-extractor.test.ts tests/editorial-scorer.test.ts tests/pipeline-e2e.test.ts tests/research-candidate-e2e.test.ts tests/autonomous-intelligence-e2e.test.ts'
    required: true
    junit: false
    timeout: 420.0

  regressions:
    max: 0
    baseline: governance/specs/athenasignal-m3.regressions.json

  artifacts:
    required:
      - path: evidence/m3/corpus.json
        kind: json_object
      - path: evidence/m3/benchmark.json
        kind: json_object
      - path: evidence/m3/signals.json
        kind: json_object
      - path: evidence/m3/candidates.json
        kind: json_object
      - path: evidence/m3/metrics.json
        kind: json_object
      - path: evidence/m3/handoff-athenaos.json
        kind: json_object
      - path: evidence/m3/human-review-packet.json
        kind: json_object

verification:
  reproducible_runs: 2
  reproducible_command: >-
    node --experimental-strip-types scripts/m3-replay.ts
  reproducible_timeout: 180.0

escalate_when:
  - required_data_missing
