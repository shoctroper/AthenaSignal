# AthenaSignal M8 — Sustained Autonomous Editorial Operation (bootstrap run).
# Deterministic gates are VERDE over the post-M7 repository; root run yields a
# HUMAN GATE via required semantic review (offline reviewer unavailable). The
# human RETURN authorizes the OpenCode worker to implement ciclo/ORDEN-012.md.
id: athenasignal-m8-sustained-autonomous-operation
version: 1

root: ../..

gate_policy:
  scope:
    required: true
  tests:
    required: true
  artifacts:
    required: true
  regressions:
    required: true
  reproducibility:
    required: true

review:
  enabled: true
  required: true

scope:
  baseline: governance/specs/athenasignal-m8.baseline.json
  allow:
    - src/
    - tests/
    - scripts/
    - ciclo/
    - docs/
    - evidence/
    - data/
    - governance/
    - package.json
    - package-lock.json
    - tsconfig.json
    - opencode.json
    - AGENTS.md
    - README.md
  deny:
    - decisiones/
    - .env
    - perfil_navegador_llm/
  ignore:
    - governance
    - node_modules
    - perfil_navegador_llm
    - .m8tmp
    - .m7tmp
    - .m6tmp
    - .m5tmp
    - .m4tmp
    - .m3tmp

acceptance:
  tests:
    command: npm test
    required: true
    junit: false
    timeout: 900.0

  regressions:
    max: 0
    baseline: governance/specs/athenasignal-m8.regressions.json

  artifacts:
    required:
      - path: src/epistemic/resolver.ts
        kind: file
      - path: tests/epistemic-resolution-e2e.test.ts
        kind: file
      - path: opencode.json
        kind: file

verification:
  reproducible_runs: 2
  reproducible_command: >-
    node -e "process.stdout.write('athenasignal-m8-probe')"
  reproducible_timeout: 60.0

escalate_when:
  - ambiguous_specification
