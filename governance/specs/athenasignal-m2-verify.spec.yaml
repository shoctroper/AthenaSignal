# AthenaSignal M2 — Signal-to-Research-Candidate Vertical Slice (STRICT
# verification run). Executed directly after the worker builds, to obtain
# deterministic red->green evidence for ciclo/ORDEN-006.md. It fails today
# (tests/research-candidate-e2e.test.ts and evidence/*.json do not exist yet)
# and must pass once M2 is built.
id: athenasignal-m2-signal-to-research-candidate-verify
version: 1

root: ../..

gate_policy:
  scope:
    required: true
  tests:
    required: true
  artifacts:
    required: true
  regressions:
    required: true
  reproducibility:
    required: true

review:
  enabled: false
  required: false

scope:
  baseline: governance/specs/athenasignal-m2.baseline.json
  allow:
    - src/
    - tests/
    - scripts/
    - ciclo/
    - docs/
    - evidence/
    - governance/
    - package.json
    - package-lock.json
    - tsconfig.json
    - AGENTS.md
    - README.md
  deny:
    - decisiones/
    - .env
    - perfil_navegador_llm/
  ignore:
    - governance
    - node_modules
    - perfil_navegador_llm

acceptance:
  tests:
    command: 'test -f tests/research-candidate-e2e.test.ts && node --test --experimental-strip-types tests/domain.test.ts tests/adapters.test.ts tests/signal-extractor.test.ts tests/editorial-scorer.test.ts tests/pipeline-e2e.test.ts tests/research-candidate-e2e.test.ts'
    required: true
    junit: false
    timeout: 300.0

  regressions:
    max: 0
    baseline: governance/specs/athenasignal-m2.regressions.json

  artifacts:
    required:
      - path: evidence/source-provenance.json
        kind: json_object
      - path: evidence/research-candidates.json
        kind: json_object
      - path: evidence/handoff-athenaos.json
        kind: json_object

verification:
  reproducible_runs: 2
  reproducible_command: >-
    node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('evidence/handoff-athenaos.json','utf8'));process.stdout.write(JSON.stringify(Object.keys(d).sort()))"
  reproducible_timeout: 60.0

escalate_when:
  - required_data_missing
