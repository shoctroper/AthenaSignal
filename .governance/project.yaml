schema_version: '1'
project: athenasignal
governance_version: 1.0.0
task_type: CODE
policy_version: 1
objective: Onboard AthenaSignal under MarioGovernance, preserving M1-M8 Legacy history
  as historical evidence and all current working-tree changes; no product implementation.
scope:
  allow:
  - src/
  - tests/
  - scripts/
  - docs/
  - ciclo/
  - evidence/
  - data/
  - governance/
  - package.json
  - package-lock.json
  - tsconfig.json
  - opencode.json
  - drafts
  deny: []
  ignore: []
acceptance:
  tests:
    command: npm test && python3 -m pytest -q tools/gov_athena/tests tools/editorial_eval/test_evaluator.py
    timeout: 300.0
    junit: false
  artifacts:
  - path: tools/gov_athena/topics.json
    kind: file
providers: {}
repository:
  id: athenasignal
  remote: origin
  branch_policy:
    mode: direct
    allowed_branches:
    - main
    require_work_branch_for:
    - ARCHITECTURE
    - RESEARCH
